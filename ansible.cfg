[defaults]
inventory = inventories/prod/hosts.yml
collections_path = ./collections
# REQUIRED by confluent.platform (asserted by the collection)
hash_behaviour = merge
forks = 20
stdout_callback = default
callback_result_format = yaml
# host_key_checking stays at the secure default (True): add host keys to known_hosts first

[tags]
# Python deps come as RPMs from Satellite (playbooks/prepare.yml) - never reach out to PyPI
skip = pip-package

[ssh_connection]
pipelining = True
