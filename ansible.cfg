[defaults]
inventory = inventories/prod/hosts.yml
collections_path = ./collections
# REQUIRED by confluent.platform (asserted by the collection)
hash_behaviour = merge
forks = 20
stdout_callback = default
callback_result_format = yaml
# host_key_checking stays at the secure default (True): add host keys to known_hosts first

[tags]
# Python deps come as RPMs from Satellite (playbooks/prepare.yml) - never reach out to PyPI
skip = pip-package

[ssh_connection]
pipelining = True
# LogLevel=ERROR: keep the hosts' SSH login banner (sshd 'Banner', e.g. /etc/issue.net) and
# ssh client notices out of task output, where they otherwise appear as error output (stderr).
# Real connection errors are still reported.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o LogLevel=ERROR
