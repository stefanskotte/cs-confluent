---
all:
  vars:
    # Lab transport: docker exec into the RHEL 8 containers (use SSH on real hosts)
    ansible_connection: community.docker.docker
    ansible_user: root
    ansible_become: true

    rhel_major: '8'   # used by verify.yml

    # RHEL 8 system python is 3.6 (RHEL 9: 3.9); cp-ansible 8.2 needs >= 3.10 (installed by prepare.yml)
    ansible_python_interpreter: /usr/bin/python3.12

    # Confluent Platform 8.2 (KRaft-only) + OpenJDK 21 from RHEL AppStream
    confluent_package_version: 8.2.4
    install_java: true
    redhat_java_package_name: java-21-openjdk-headless   # server JRE; plain java-21-openjdk drags in gtk3/X11 deps

    # LAB ONLY: small heaps so 6 JVMs fit in an 8 GB Docker VM (do NOT copy to production)
    kafka_controller_service_environment_overrides:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    kafka_broker_service_environment_overrides:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m -XX:+UseG1GC"

kafka_controller:
  hosts:
    kafka-controller1:
    kafka-controller2:
    kafka-controller3:

kafka_broker:
  hosts:
    kafka-broker1:
    kafka-broker2:
    kafka-broker3:
