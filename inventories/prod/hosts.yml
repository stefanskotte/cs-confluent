---
# Production inventory - replace the example FQDNs with the delivered servers.
# The inventory hostname is what Kafka advertises to clients and peers, so use
# the FQDN that clients and the other nodes resolve (DNS, not just /etc/hosts on
# the control node). If the control node must reach a host on another address,
# add `ansible_host: <ip>` under that host.
all:
  children:
    kafka_controller:          # KRaft controllers - always an odd number, 3 recommended
      hosts:
        kctrl01.example.com:
        kctrl02.example.com:
        kctrl03.example.com:
    kafka_broker:              # brokers - 3+ for RF=3 / min.insync.replicas=2
      hosts:
        kbrk01.example.com:
        kbrk02.example.com:
        kbrk03.example.com:
