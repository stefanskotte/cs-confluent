---
# ---------------------------------------------------------------------------
# Vars to merge into the existing inventory / group_vars/all.yml
# Validated: RHEL 8.10 + confluent.platform 8.2.4 + CP 8.2.4 (KRaft) + OpenJDK 21
# Control node MUST run ansible-core 2.16.x for RHEL 8 targets (see README)
# ---------------------------------------------------------------------------
all:
  vars:
    # --- Confluent Platform version (required; collection fails early if empty)
    confluent_package_version: 8.2.4

    # --- Java: OpenJDK 21 from RHEL 8 AppStream
    install_java: true
    # headless = server JRE. The collection default 'java-21-openjdk' also pulls in
    # gtk3 / X11 desktop libs.
    redhat_java_package_name: java-21-openjdk-headless

    # --- Python on managed hosts: collection asserts >= 3.10, RHEL 8 system python is 3.6
# (dnf tasks still respawn into /usr/libexec/platform-python 3.6 - hence ansible-core 2.16)
    # (python3.12 + deps installed by prepare.yml before running the collection)
    ansible_python_interpreter: /usr/bin/python3.12

    # --- Satellite / no-internet hosts (uncomment as applicable) ----------------
    # Confluent RPMs mirrored in Satellite as a custom product: drop a .repo file
    # on the CONTROL node and point the collection at it (stops it writing
    # /etc/yum.repos.d/confluent.repo -> packages.confluent.io)
    # repository_configuration: custom
    # custom_yum_repofile_filepath: "{{ inventory_dir }}/files/confluent-satellite.repo"
    #
    # ...or if Satellite already delivers the Confluent repo via the content view:
    # repository_configuration: none
    #
    # Confluent CLI tarball is fetched from S3 by default:
    # confluent_cli_download_enabled: false

# KRaft topology: dedicated controllers (use 3 in production) + brokers
# kafka_controller:
#   hosts:
#     ctrl1.example.com:
#     ctrl2.example.com:
#     ctrl3.example.com:
# kafka_broker:
#   hosts:
#     broker1.example.com:
#     broker2.example.com:
#     broker3.example.com:
