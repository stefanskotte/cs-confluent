name: cp-rhel9
x-node: &node
  build: { context: ., dockerfile: Dockerfile.rhel9 }
  image: local/rhel9-systemd:latest
  privileged: true
  cgroup: host
  tmpfs: [/run, /tmp]
  volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
  networks: [confluent]
services:
  kafka-controller1: { <<: *node, container_name: kafka-controller1, hostname: kafka-controller1 }
  kafka-controller2: { <<: *node, container_name: kafka-controller2, hostname: kafka-controller2 }
  kafka-controller3: { <<: *node, container_name: kafka-controller3, hostname: kafka-controller3 }
  kafka-broker1:     { <<: *node, container_name: kafka-broker1,     hostname: kafka-broker1 }
  kafka-broker2:     { <<: *node, container_name: kafka-broker2,     hostname: kafka-broker2 }
  kafka-broker3:     { <<: *node, container_name: kafka-broker3,     hostname: kafka-broker3 }
networks:
  confluent: { name: confluent }
